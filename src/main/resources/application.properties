# Application
spring.application.name=expense-tracker
server.port=${SERVER_PORT:8080}

# Database Configuration (MySQL)
# Credentials come from the environment; the defaults are local-dev only.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:expense_tracker_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Dialect is auto-detected from the driver; setting MySQL8Dialect explicitly is
# deprecated in Hibernate 6.

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# JWT Configuration
# Set JWT_SECRET in production. It must be a Base64-encoded key of at least 256 bits.
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Bootstrap admin account
# Set both ADMIN_EMAIL and ADMIN_PASSWORD to have the first admin created (or an
# existing account promoted) on startup. Leave blank to skip.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_NAME:System Administrator}

# Logging
logging.level.com.expensetracker=INFO
logging.level.org.springframework.security=INFO

# Email (SMTP)
# Budget-alert emails are skipped silently when these are unset.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
